name: FailureVerse verification
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.5
      - name: Basic Python lint
        run: python -m ruff check --select E9,F63,F7,F82 backend demo-app scripts
      - name: Credential files and literal secrets
        run: python scripts/check_secrets.py --history --self-test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            demo-app/requirements.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend
      - run: python -m pytest -q
        working-directory: demo-app
      - name: Controlled evaluation (simulated tools and scripted model)
        run: python scripts/evaluate_agent.py --output artifacts/evaluation-scripted.json
      - name: Controlled coordination evaluation (simulated tools and scripted model)
        run: python scripts/evaluate_workflow.py --output artifacts/phase3/evaluation-scripted.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run build
      - run: npm run typecheck:browser

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up --no-build --wait --wait-timeout 120
      - run: python3 scripts/smoke.py --frontend http://127.0.0.1:8080
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Real Chromium dashboard checks (no live Ollama required)
        run: npm run test:browser
        working-directory: frontend
      - name: Save browser verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: artifacts/phase3/browser/
          retention-days: 7
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --timeout 10
