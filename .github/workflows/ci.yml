name: Phase 1 verification
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            demo-app/requirements.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest
        working-directory: backend
      - run: python -m pytest -q
        working-directory: demo-app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up --no-build --wait --wait-timeout 120
      - run: python3 scripts/smoke.py --frontend http://127.0.0.1:8080
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --timeout 10
